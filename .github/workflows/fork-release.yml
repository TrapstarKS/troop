# Stable fork release: validate all assets in draft, publish only after every platform succeeds.
# Stable Android builds require a private signer; testing-latest is a separate public-key channel.
name: Release build (fork)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (patch = 0.0.x, minor = 0.x.0, major = x.0.0)"
        type: choice
        options: [patch, minor, major, none]
        default: patch
      version:
        description: "Explicit version override, e.g. 8.3.0 (blank = apply the bump above)"
        required: false
        default: ""

# Workflow-level default is read-only; each job below that actually pushes a commit or
# publishes/uploads a release grants itself `contents: write` explicitly (issue #657 — every job
# here does end up needing it, since each one either commits a version bump, creates the release,
# uploads a release asset, or pushes the AltStore manifest, but scoping it per-job means a future
# job added to this workflow doesn't silently inherit write access it doesn't need).
permissions:
  contents: read

concurrency:
  group: release-build
  cancel-in-progress: false   # never cancel a release mid-publish

jobs:
  bump:
    runs-on: ubuntu-latest
    # Pushes the version-bump commit to the dispatched branch and creates the GitHub release.
    permissions:
      contents: write
    outputs:
      ver: ${{ steps.b.outputs.ver }}
      tag: ${{ steps.b.outputs.tag }}
      sha: ${{ steps.b.outputs.sha }}
      buildVersion: ${{ steps.b.outputs.buildVersion }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Require stable signing configuration before changing versions
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          CERT: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for NAME in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!NAME}" || { echo "::error::Missing signing secret: $NAME"; exit 1; }
          done
          [[ "${CERT//:/}" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::Private signing secrets and certificate SHA-256 are required"; exit 1; }
      - id: b
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ github.event.inputs.bump }}
          OVERRIDE: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          GRADLE=android/app/build.gradle.kts

          # Android versionName is the source of truth UpdateCheck compares against.
          CUR=$(grep -m1 'versionName = "' "$GRADLE" | sed -E 's/.*"([^"]+)".*/\1/')
          IFS=. read -r MA MI PA <<< "$CUR"; MA=${MA:-0}; MI=${MI:-0}; PA=${PA:-0}
          case "${BUMP:-patch}" in
            major) NEW="$((MA+1)).0.0" ;;
            minor) NEW="${MA}.$((MI+1)).0" ;;
            patch) NEW="${MA}.${MI}.$((PA+1))" ;;
            none|"") NEW="$CUR" ;;
            *) echo "Unknown bump: $BUMP" >&2; exit 1 ;;
          esac
          [ -n "${OVERRIDE:-}" ] && NEW="$OVERRIDE"
          [[ "$NEW" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::Version must be X.Y.Z"; exit 1; }
          TAG="v${NEW}"
          Tools/require-release-absent.sh "$GITHUB_REPOSITORY" "$TAG"
          REMOTE_TAG=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          test -z "$REMOTE_TAG" || { echo "::error::Remote tag already exists; refusing source/artifact mismatch"; exit 1; }
          echo "ver=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $CUR -> $NEW  (tag $TAG)"

          if [ "$NEW" != "$CUR" ]; then
            # Bump BOTH platforms' version + build number in source, then commit to the branch so the
            # built artifacts report $NEW (each build number is an independent monotonic counter).
            ACODE=$(grep -m1 'versionCode = ' "$GRADLE" | sed -E 's/.*versionCode = ([0-9]+).*/\1/')
            ICODE=$(grep -m1 'CURRENT_PROJECT_VERSION:' project.yml | sed -E 's/.*"([0-9]+)".*/\1/')
            sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"$NEW\"/" "$GRADLE"
            sed -i -E "s/versionCode = [0-9]+/versionCode = $((ACODE+1))/" "$GRADLE"
            sed -i -E "s/MARKETING_VERSION: \"[^\"]+\"/MARKETING_VERSION: \"$NEW\"/" project.yml
            sed -i -E "s/CURRENT_PROJECT_VERSION: \"[0-9]+\"/CURRENT_PROJECT_VERSION: \"$((ICODE+1))\"/" project.yml
            # In-app "What's New": generate the AppChangelog entry (both platforms) + bump its constant
            # from docs/releases/<TAG>.md's whatsnew: front-matter, so the in-app card ships in sync with
            # this version. Warn (don't fail) if the notes file / its front-matter is missing.
            if [ -f "docs/releases/${TAG}.md" ]; then
              python3 -m pip install --quiet pyyaml==6.0.2 >/dev/null 2>&1 || true
              python3 Tools/appchangelog-gen.py "docs/releases/${TAG}.md" \
                || echo "::warning::appchangelog-gen failed for ${TAG} — in-app 'What's New' not updated."
            else
              echo "::warning::No docs/releases/${TAG}.md — GitHub notes + in-app 'What's New' will use placeholders."
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -am "Release ${NEW}: bump version (${BUMP}) + build numbers + What's New"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # The iOS build number (CURRENT_PROJECT_VERSION as it now stands in project.yml, bumped or not),
          # for the AltStore manifest's buildVersion.
          echo "buildVersion=$(grep -m1 'CURRENT_PROJECT_VERSION:' project.yml | sed -E 's/.*\"([0-9]+)\".*/\1/')" >> "$GITHUB_OUTPUT"

          # Draft at the bumped commit. Published tags and assets are never overwritten.
          Tools/require-release-absent.sh "$GITHUB_REPOSITORY" "$TAG"
          {
            # Release body = the maintained per-version changelog docs/releases/<TAG>.md, plus a
            # downloads footer. Warn (don't fail) if that file is missing so you notice a forgotten
            # changelog. (CHANGELOG.md is the stale legacy file; docs/releases/ is the source of truth.)
            BODY=$(mktemp)
            NOTES_MD="docs/releases/${TAG}.md"
            if [ -f "$NOTES_MD" ]; then
              # Strip a leading YAML front-matter block (the `whatsnew:` used by appchangelog-gen) so it
              # never leaks into the GitHub release body; files without front-matter pass through unchanged.
              awk 'NR==1 && $0=="---"{fm=1; next} fm && $0=="---"{fm=0; next} !fm{print}' "$NOTES_MD" > "$BODY"
            else
              echo "::warning::No ${NOTES_MD} — write the release notes there first. Using a placeholder."
              printf 'NOOP **%s** — release build.\n' "$NEW" > "$BODY"
            fi
            # Auto "What's Changed" breakdown: GitHub's generate-notes API lists every merged PR since the
            # previous RELEASE (non-prerelease, so testing-latest snapshots are ignored), + contributors +
            # a full-changelog compare link. Appended below the curated notes. Skipped on the very first
            # release (no prior tag → the diff would run to repo start). Best-effort: a failure is ignored.
            PREV=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
              --json tagName,isPrerelease,isDraft \
              --jq 'map(select(.isPrerelease==false and .isDraft==false)) | .[0].tagName // empty' 2>/dev/null || true)
            if [ -n "$PREV" ]; then
              AUTO=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                -f tag_name="$TAG" -f previous_tag_name="$PREV" -f target_commitish="$(git rev-parse HEAD)" \
                --jq '.body' 2>/dev/null || true)
              # Drop only the MAINTAINER's own "by @author" credit (#736). This used to strip every handle
              # and delete the "New Contributors" block outright, on the premise that this is a solo fork —
              # a premise that no longer holds: 16 people have landed PRs here, 7 of them in v9.1.0 alone,
              # and that release's auto notes carried 66 third-party credits, every one of them removed.
              # Self-credit on nearly every line is still noise and a self-mention notifies nobody, so the
              # maintainer's handles keep being stripped; everyone else's is the whole point of the section.
              AUTO=$(printf '%s' "$AUTO" \
                | sed -E 's/ by @([Rr]yanbr|[Ff]anboynz)([^A-Za-z0-9_-]|$)/\2/g')
              [ -n "$AUTO" ] && printf '\n---\n\n%s\n' "$AUTO" >> "$BODY"
            else
              echo "First release (no prior release tag) — skipping the auto PR breakdown."
            fi
            {
              printf '\n---\n\n**Downloads** — troop fork identities; export/import .noopbak when migrating from upstream or staging. See docs/INSTALL.md.\n'
              printf -- '- **Android** — `NOOP-android-v%s.apk` (`com.trapstarks.troop`, privately signed) — installs beside upstream NOOP with separate data.\n' "$NEW"
              printf -- '- **macOS** — `NOOP-macos-v%s.zip` (`com.trapstarks.troop.noop.staging`; unzip, then right-click → Open) — separate bundle identity from upstream NOOP.\n' "$NEW"
              printf -- '- **iOS** — `NOOP-ios-unsigned-v%s.ipa` (`com.trapstarks.troop.noop`; SideStore / AltStore Classic) — installs beside upstream NOOP under the fork identity. An update replaces the same provisioned fork app; back up before changing sideloaders, accounts, or bundle IDs.\n' "$NEW"
            } >> "$BODY"
            REMOTE_TAG=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
            test -z "$REMOTE_TAG" || { echo "::error::Remote tag appeared during build preparation"; exit 1; }
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" \
              --title "troop ${NEW}" --notes-file "$BODY" --draft
          }

  android:
    needs: bump
    runs-on: ubuntu-latest
    # Uploads the built APK to the release created by the `bump` job.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    outputs:
      sha256: ${{ steps.artifact.outputs.sha256 }}
      metadataSHA256: ${{ steps.artifact.outputs.metadataSHA256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.bump.outputs.sha }}   # build the bumped commit
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Configure private release signer
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/troop-release.keystore"
          python3 - <<'CONFIG'
          import os, runpy
          from pathlib import Path
          escaped = runpy.run_path('../Tools/verify-release-artifacts.py')['properties_value']
          fields = {'storeFile': os.environ['RUNNER_TEMP'] + '/troop-release.keystore',
                    'storePassword': os.environ['STORE_PASSWORD'], 'keyAlias': os.environ['KEY_ALIAS'],
                    'keyPassword': os.environ['KEY_PASSWORD']}
          Path('keystore.properties').write_text(''.join(k + '=' + escaped(v) + '\n' for k, v in fields.items()))
          CONFIG
      - name: Build privately signed Full release APK
        run: ./gradlew assembleFullRelease
      - name: Validate APK identity, signature, and version
        env:
          VER: ${{ needs.bump.outputs.ver }}
          CERT: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/full/release -name '*.apk' -type f)
          test -f "$APK"
          ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          PUBLIC_CERT=$(keytool -exportcert -keystore fork-debug.keystore -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)
          NORMALIZED_CERT=$(printf '%s' "${CERT//:/}" | tr '[:upper:]' '[:lower:]')
          test "$NORMALIZED_CERT" != "$PUBLIC_CERT" || { echo "::error::Stable signer must not be the public staging key"; exit 1; }
          PREVIOUS_CODE=0
          PREVIOUS_ARGS=()
          PREVIOUS_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease --jq 'map(select(.isDraft==false and .isPrerelease==false)) | .[0].tagName // empty')
          if [ -n "$PREVIOUS_TAG" ]; then
            mkdir -p "$RUNNER_TEMP/previous"
            gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'NOOP-android-v*.apk' --dir "$RUNNER_TEMP/previous"
            PREVIOUS_APK=$(find "$RUNNER_TEMP/previous" -name '*.apk' -type f)
            test -f "$PREVIOUS_APK"
            if [ "$("$ANALYZER" manifest application-id "$PREVIOUS_APK")" = com.trapstarks.troop ]; then
              PREVIOUS_CODE=$("$ANALYZER" manifest version-code "$PREVIOUS_APK")
              PREVIOUS_ARGS=(--previous-apk "$PREVIOUS_APK")
            fi
          fi
          python3 ../Tools/verify-release-artifacts.py apk "$APK" --package-id com.trapstarks.troop \
            --version "$VER" --cert-sha256 "$CERT" --previous-code "$PREVIOUS_CODE" \
            --apkanalyzer "$ANALYZER" --apksigner "$SIGNER" "${PREVIOUS_ARGS[@]}" > "NOOP-android-v${VER}-metadata.json"
      - name: Remove private signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/troop-release.keystore"
      - name: Version the filename + attach
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.bump.outputs.ver }}
        run: |
          cp app/build/outputs/apk/full/release/*.apk "NOOP-android-v${VER}.apk"
          echo "sha256=$(sha256sum "NOOP-android-v${VER}.apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "metadataSHA256=$(sha256sum "NOOP-android-v${VER}-metadata.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          gh release upload "${{ needs.bump.outputs.tag }}" "NOOP-android-v${VER}.apk" "NOOP-android-v${VER}-metadata.json" \
            --repo "$GITHUB_REPOSITORY"

  macos:
    needs: bump
    runs-on: macos-15
    timeout-minutes: 40
    # Uploads the built .app zip to the release created by the `bump` job.
    permissions:
      contents: write
    outputs:
      sha256: ${{ steps.artifact.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - name: Install XcodeGen
        # Known unpinned-tooling gap (issue #657): Homebrew core doesn't keep old formula versions
        # around, so `brew install xcodegen@<version>` / a version-pin syntax isn't available here —
        # this always installs whatever xcodegen is current in homebrew-core on the runner image at
        # run time. Left as a tracked gap rather than silently unaddressed.
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build NOOP.app (macOS, unsigned, universal)
        # #51: 'platform=macOS' on an Apple-Silicon runner resolves to the host arch and thins the binary to
        # arm64-only. That shipped an arm64-only app that won't launch on Intel Macs. Force a true universal
        # build with the generic destination + explicit ARCHS/ONLY_ACTIVE_ARCH, which override whatever the
        # configuration says and therefore keep holding after the switch below.
        #
        # #2393: Release, matching the iOS leg. macOS shipped Debug for no reason anyone chose — #51 was
        # about architecture and said so, and "unchanged shipping behaviour" there meant that PR was not
        # also changing the configuration. The artefact showed it: a 120 KB stub plus a 195 MB
        # `.debug.dylib` and a `__preview.dylib`, against 53 MB for the same commit built Release. A
        # reporter measured the shipped build costing a third to half a CPU core at idle, and unoptimised
        # SwiftUI compounds a hot path that already ran every frame.
        #
        # What Release removes beyond the optimisation: `#if DEBUG` code, which here is previews, sample
        # data and the `--demo-sync` screenshot harness (its own doc already says it is stripped from every
        # Release build). The iOS artefact has shipped without all of that since it went Release, so this
        # brings macOS into line rather than into new territory. Use a local Debug build for the harness.
        run: >-
          xcodebuild -scheme Strand -configuration Release
          -destination 'generic/platform=macOS' ARCHS="x86_64 arm64" ONLY_ACTIVE_ARCH=NO
          -derivedDataPath build/dd
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build
      - name: Verify universal binary
        run: |
          APP=$(find build/dd/Build/Products -maxdepth 3 -name '*.app' -type d | head -1)
          EXE=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f ! -name '*.dylib' | head -1)
          echo "archs: $(lipo -archs "$EXE")"
          { lipo -archs "$EXE" | grep -qw x86_64 && lipo -archs "$EXE" | grep -qw arm64; } \
            || { echo "::error::macOS binary is not universal (expected x86_64 + arm64)"; exit 1; }
      - name: Package + attach
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.bump.outputs.ver }}
        run: |
          APP=$(find build/dd/Build/Products -maxdepth 3 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo ".app not found"; exit 1; }
          SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          test "$SHORT" = "$VER"
          Tools/anonymize-macos-app.sh "$APP"
          # #429: ad-hoc sign the BUNDLE so it has a stable per-build code identity. macOS 26 (Tahoe) won't
          # bind a Bluetooth TCC grant to an UNSIGNED bundle, so users wedge at CBManagerState .unauthorized
          # even after a fresh `tccutil reset` + approve. `--sign -` gives a real cdhash-based designated
          # requirement TCC can grant to. No --entitlements / --options runtime: stays non-sandboxed so BT
          # goes through plain TCC + the Info.plist usage string. (cdhash still changes per build, so a
          # future UPDATE still needs the re-toggle the in-app #429/#295 banner already describes.)
          codesign --force --deep --sign - "$APP"
          codesign -dvv "$APP" 2>&1 | grep -Ei 'identifier|signature|flags' || true
          ditto -c -k --keepParent "$APP" "NOOP-macos-v${VER}.zip"
          echo "sha256=$(shasum -a 256 "NOOP-macos-v${VER}.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          gh release upload "${{ needs.bump.outputs.tag }}" "NOOP-macos-v${VER}.zip" --repo "$GITHUB_REPOSITORY"

  ios:
    needs: bump
    # iOS 26 Liquid Glass (glassEffect) needs the iOS 26 SDK → Xcode 26 → macos-26.
    runs-on: macos-26
    timeout-minutes: 40
    # Uploads the built .ipa to the release created by the `bump` job.
    permissions:
      contents: write
    outputs:
      sha256: ${{ steps.artifact.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install XcodeGen
        # Known unpinned-tooling gap (issue #657): Homebrew core doesn't keep old formula versions
        # around, so `brew install xcodegen@<version>` / a version-pin syntax isn't available here —
        # this always installs whatever xcodegen is current in homebrew-core on the runner image at
        # run time. Left as a tracked gap rather than silently unaddressed.
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build NOOPiOS for device (unsigned, Release)
        # #53: build RELEASE, not Debug. A Debug build carries get-task-allow + debug artifacts that make a
        # re-signed sideload fail "integrity could not be verified" on modern iOS; Release (the correct config
        # for a distributed app) installs clean — confirmed by the reporter's own Release build.
        run: >-
          xcodebuild -scheme NOOPiOS -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath build/dd
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build
      - name: Package sideload .ipa (strip watch, preserve app/widget capabilities) + attach
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.bump.outputs.ver }}
        run: |
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo ".app (iphoneos) not found"; exit 1; }
          Tools/package-ios-ipa.sh "$APP" "NOOP-ios-unsigned-v${VER}.ipa" com.trapstarks.troop.noop "$VER"
          echo "sha256=$(shasum -a 256 "NOOP-ios-unsigned-v${VER}.ipa" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          gh release upload "${{ needs.bump.outputs.tag }}" "NOOP-ios-unsigned-v${VER}.ipa" --repo "$GITHUB_REPOSITORY"

  publish:
    needs: [bump, android, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate complete draft and publish immutable checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.bump.outputs.ver }}
          TAG: ${{ needs.bump.outputs.tag }}
          SOURCE_SHA: ${{ needs.bump.outputs.sha }}
          ANDROID_SHA: ${{ needs.android.outputs.sha256 }}
          METADATA_SHA: ${{ needs.android.outputs.metadataSHA256 }}
          MACOS_SHA: ${{ needs.macos.outputs.sha256 }}
          IOS_SHA: ${{ needs.ios.outputs.sha256 }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" = true
          mkdir artifacts
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts
          printf '%s\n' "NOOP-android-v${VER}.apk" "NOOP-android-v${VER}-metadata.json" \
            "NOOP-macos-v${VER}.zip" "NOOP-ios-unsigned-v${VER}.ipa" | sort > expected-assets.txt
          find artifacts -mindepth 1 -maxdepth 1 -exec basename {} \; | sort > downloaded-assets.txt
          diff -u expected-assets.txt downloaded-assets.txt
          test -f "artifacts/NOOP-android-v${VER}.apk"
          test -f "artifacts/NOOP-android-v${VER}-metadata.json"
          test -f "artifacts/NOOP-macos-v${VER}.zip"
          test -f "artifacts/NOOP-ios-unsigned-v${VER}.ipa"
          python3 Tools/verify-release-artifacts.py ipa "artifacts/NOOP-ios-unsigned-v${VER}.ipa" \
            --bundle-id com.trapstarks.troop.noop --version "$VER"
          # Validate the source before publishing; this temporary file is never advertised while draft.
          Tools/update-altstore-source.sh --repo "$GITHUB_REPOSITORY" --source altstore-source.json \
            --asset-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/NOOP-ios-unsigned-v${VER}.ipa" \
            --version "$VER" --ipa "artifacts/NOOP-ios-unsigned-v${VER}.ipa"
          printf '%s  %s\n' "$ANDROID_SHA" "NOOP-android-v${VER}.apk" \
            "$METADATA_SHA" "NOOP-android-v${VER}-metadata.json" \
            "$MACOS_SHA" "NOOP-macos-v${VER}.zip" \
            "$IOS_SHA" "NOOP-ios-unsigned-v${VER}.ipa" > artifacts/SHA256SUMS
          (cd artifacts && sha256sum --check SHA256SUMS)
          REMOTE_SHA=$(git ls-remote --tags --sort=refname origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -1 | cut -f1)
          test -z "$REMOTE_SHA" || test "$REMOTE_SHA" = "$SOURCE_SHA" || { echo "::error::Release tag differs from validated source"; exit 1; }
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .target_commitish)" = "$SOURCE_SHA"
          gh release upload "$TAG" artifacts/SHA256SUMS --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" = false

  altstore:
    needs: [bump, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate published download and update the Classic source
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.bump.outputs.ver }}
          TAG: ${{ needs.bump.outputs.tag }}
        run: |
          set -euo pipefail
          IPA="NOOP-ios-unsigned-v${VER}.ipa"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${IPA}"
          curl --fail --location --retry 3 "$URL" --output "$IPA"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
          CHECKSUM_LINE=$(awk -v file="$IPA" '$2==file {print}' SHA256SUMS)
          test -n "$CHECKSUM_LINE"
          printf '%s\n' "$CHECKSUM_LINE" | sha256sum --check
          Tools/update-altstore-source.sh --repo "$GITHUB_REPOSITORY" --source altstore-source.json \
            --asset-url "$URL" --version "$VER" --ipa "$IPA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add altstore-source.json
          git commit -m "Release ${VER}: update troop Classic source"
          git push origin HEAD:main
